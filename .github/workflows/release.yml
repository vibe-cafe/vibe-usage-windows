name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      kind:
        description: >-
          external-test: the separate "Vibe Usage Test" app, never updates.
          release-candidate: same identity as the released app, for upgrade
          testing; Actions artifact only, no latest.json.
        type: choice
        options: [external-test, release-candidate]
        default: external-test

permissions:
  actions: read
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      # Only a pushed v* tag builds a release. A manual run always builds a
      # test kind and never touches the GitHub Release, even on a tag ref.
      VIBE_USAGE_BUILD_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || 'release' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: node scripts/check-version.mjs

      # The app no longer bundles the CLI: `cli-bootstrap.mjs` resolves
      # `@vibe-cafe/vibe-usage@latest` in the user's machine and runs it with the
      # bundled Node. It is the only path from this build to the CLI, so a build
      # whose launcher cannot resolve and execute latest is broken for every
      # user — this exercises that path for real (registry + integrity + run)
      # instead of comparing a checked-in snapshot.
      - name: CLI launcher resolves and runs latest
        run: node src-tauri/resources/cli-bootstrap.mjs --version

      - name: Bundle Node runtime
        run: node scripts/fetch-node.mjs

      - name: Tests
        run: |
          pnpm test
          cargo test --workspace

      - name: Build signed NSIS installer
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ALLOW_UNTRUSTED_SIGNATURE: "true"
          VIBE_USAGE_APP_COMMIT: ${{ github.sha }}
          VIBE_USAGE_APP_BUILD: ${{ github.run_number }}
          TAURI_FEATURES: ${{ env.VIBE_USAGE_BUILD_KIND == 'external-test' && 'external-test-diagnostics' || '' }}
        run: ./scripts/build-tauri-windows.ps1

      - name: Collect signed artifacts
        id: artifacts
        shell: pwsh
        env:
          SIGNPATH_ALLOW_UNTRUSTED_SIGNATURE: "true"
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*$version*setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "NSIS installer not found."
          }

          foreach ($artifact in @($installer.FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact
            $signatureStatus = $signature.Status.ToString()
            if ($signatureStatus -eq "NotSigned" -or $signatureStatus -eq "HashMismatch") {
              throw "Invalid Authenticode signature for ${artifact}: $($signature.Status). $($signature.StatusMessage)"
            }
            if ($signatureStatus -ne "Valid") {
              $message = "Untrusted Authenticode signature for ${artifact}: $($signature.Status). $($signature.StatusMessage)"
              if ($env:SIGNPATH_ALLOW_UNTRUSTED_SIGNATURE -match '^(1|true|yes|on)$') {
                Write-Warning $message
              } else {
                throw $message
              }
            }
            Write-Host "Verified Authenticode signature: $artifact"
          }

          if ($env:VIBE_USAGE_BUILD_KIND -eq "release-candidate") {
            # A candidate carries the released app's identity, so its name says
            # what it is, and it gets no update manifest that could point users at it.
            $dest = "VibeUsage-$version-Windows-Candidate-$($env:GITHUB_RUN_NUMBER)-Setup.exe"
            Copy-Item $installer.FullName $dest -Force
          } else {
            $dest = "VibeUsage-$version-Windows-Setup.exe"
            Copy-Item $installer.FullName $dest -Force
            node scripts/generate-updater-manifest.mjs $dest
          }
          "installer=$dest" >> $env:GITHUB_OUTPUT

      - name: Upload to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.artifacts.outputs.installer }}
            latest.json

      # Installer and updater manifest are separate artifacts so testers
      # download a zip containing exactly one obvious .exe.
      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VIBE_USAGE_BUILD_KIND == 'release-candidate' && format('windows-installer-candidate-{0}', github.run_number) || 'windows-installer-external-test' }}
          path: ${{ steps.artifacts.outputs.installer }}

      - name: Upload updater manifest artifact
        if: github.event_name == 'workflow_dispatch' && env.VIBE_USAGE_BUILD_KIND == 'external-test'
        uses: actions/upload-artifact@v7
        with:
          name: updater-manifest
          path: latest.json
