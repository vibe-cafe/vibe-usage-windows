# Throwaway WinUI 3 panel sample (branch poc/winui3-panel only, never merged).
# Builds unsigned, self-contained x64 and arm64 folders (unzip and run) and
# screenshots the panel on the runner. Touches nothing else in the repo.
name: WinUI 3 panel sample

on:
  push:
    branches: [poc/winui3-panel]
    paths:
      - "poc/winui3-panel/**"
      - ".github/workflows/winui3-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui3-poc-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Unit tests (placement, click race)
        run: dotnet test poc/winui3-panel/tests/PanelPoc.Tests.csproj -c Release

  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            name: VibeUsagePanelPoc-x64
          - arch: arm64
            platform: ARM64
            name: VibeUsagePanelPoc-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Publish (self-contained, unpackaged)
        run: >
          dotnet publish poc/winui3-panel/VibeUsagePanelPoc/VibeUsagePanelPoc.csproj
          -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }}
          -o out/${{ matrix.name }}
      - name: Size
        shell: pwsh
        run: |
          $dir = "out/${{ matrix.name }}"
          $files = Get-ChildItem $dir -Recurse -File
          "{0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
          $files | Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path $dir).Path.Length + 1) }
          Get-ChildItem $dir -Filter *.pri | ForEach-Object { "pri: {0} ({1:N0} KB)" -f $_.Name, ($_.Length / 1KB) }
          "{0} language folders" -f (Get-ChildItem $dir -Directory | Where-Object Name -match '^[a-z]{2}(-[A-Za-z]+)*$').Count
          Compress-Archive -Path "$dir/*" -DestinationPath "out/size-check.zip"
          "zip {0:N1} MB" -f ((Get-Item out/size-check.zip).Length / 1MB)
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}/
          retention-days: 30

  screenshot:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: VibeUsagePanelPoc-x64
          path: C:\poc\app
      - name: Run the sample and screenshot the panel
        shell: pwsh
        run: ./poc/winui3-panel/ci/screenshot.ps1 -AppDir C:\poc\app -OutDir C:\poc\shots
      - name: Click the tray icon (smoke test, runner VM)
        shell: pwsh
        run: ./poc/winui3-panel/ci/interaction.ps1 -AppDir C:\poc\app -OutDir C:\poc\shots
      - name: Same checks at 150 % scaling (best effort, report only)
        if: always()
        shell: pwsh
        run: |
          ./poc/winui3-panel/ci/set-dpi.ps1 -Percent 150
          if ($LASTEXITCODE -eq 0) {
            ./poc/winui3-panel/ci/interaction.ps1 -AppDir C:\poc\app -OutDir C:\poc\shots -Tag '-150' -ReportOnly
          } else {
            Write-Host '::warning::could not switch the runner to 150 %; only 100 % was checked'
          }
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: winui3-panel-screenshots
          path: C:\poc\shots\
          retention-days: 30


  # Issue #86 measurements (heavy): run on a manual trigger, sizes on a commit
  # whose message contains 「[实测」, the 35-minute network test only with 「[实测-联网]」.
  size:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[实测')
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            props: ""
          - variant: r2r
            props: "-p:PublishReadyToRun=true"
          - variant: trim-partial
            props: "-p:PublishTrimmed=true -p:TrimMode=partial"
          - variant: trim-full
            props: "-p:PublishTrimmed=true -p:TrimMode=full"
          - variant: trim-full-r2r
            props: "-p:PublishTrimmed=true -p:TrimMode=full -p:PublishReadyToRun=true"
          - variant: aot
            props: "-p:PublishAot=true"
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Current Tauri installer (node.exe and main exe for the estimate)
        shell: pwsh
        run: |
          gh release download --repo ${{ github.repository }} --pattern '*Setup.exe' --dir tauri-dl
          Get-ChildItem tauri-dl | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          7z x (Get-ChildItem tauri-dl\*.exe | Select-Object -First 1).FullName -otauri -y | Out-Null
          Get-ChildItem tauri -Recurse -File | Sort-Object Length -Descending | Select-Object -First 8 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path tauri).Path.Length + 1) }
      - name: Publish (${{ matrix.variant }})
        id: publish
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish poc/winui3-panel/VibeUsagePanelPoc/VibeUsagePanelPoc.csproj -c Release -r win-x64 -p:Platform=x64 ${{ matrix.props }} -o out/app 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Measure, package, smoke test, Defender scan
        if: always()
        shell: pwsh
        run: ./poc/winui3-panel/ci/size.ps1 -Variant ${{ matrix.variant }} -AppDir out/app -OutDir out/result -PublishLog publish.log -TauriDir tauri
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: size-${{ matrix.variant }}
          path: out/result/
          retention-days: 30

  network:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[实测-联网]')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: VibeUsagePanelPoc-x64
          path: C:\poc\app
      - name: Does the runtime go online by itself? (offline, online×2 diagnostic levels)
        shell: pwsh
        run: ./poc/winui3-panel/ci/network.ps1 -AppDir C:\poc\app -OutDir C:\poc\net -Minutes 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-results
          path: C:\poc\net\
          retention-days: 30
