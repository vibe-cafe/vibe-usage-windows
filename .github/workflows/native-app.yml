# The native Windows shell (WinUI 3, native/src/VibeUsage.App): unit tests of
# its pure parts, a self-contained fully trimmed x64 publish, then on a second
# runner the original-size screenshots (PrintWindow) and the tray smoke test,
# at 100 % and again at 150 %; on two more runners every scene of the 订阅配额
# card at 100 % and 150 % and, at 100 %, the card driven by pointer and
# keyboard. The app runs on the in-memory fake backend: no network, no
# credentials, no user data.
name: Native app

on:
  push:
    branches: [main, 'feat/native-**']
    paths:
      - 'native/**'
      - '.github/workflows/native-app.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-app.yml'

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Shell unit tests (open and close rules, placement, click race, demo data)
        run: dotnet test native/tests/VibeUsage.App.Tests -c Release
      - name: Publish (self-contained, full trimming, x64)
        shell: pwsh
        run: |
          dotnet publish native/src/VibeUsage.App/VibeUsage.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out/app 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $warnings = Select-String -Path publish.log -Pattern 'warning (IL\d+|RS0030|CsWinRT\d+)' | Sort-Object Line -Unique
          if ($warnings) { $warnings | ForEach-Object { Write-Host "::error::$($_.Line)" }; exit 1 }
          Write-Host 'no trim, WinRT trimming or banned-API warnings'
      - name: Size
        shell: pwsh
        run: |
          $files = Get-ChildItem out/app -Recurse -File
          "{0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
          $files | Sort-Object Length -Descending | Select-Object -First 12 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name }
          Compress-Archive -Path out/app/* -DestinationPath out/size-check.zip
          "zip {0:N1} MB" -f ((Get-Item out/size-check.zip).Length / 1MB)
      - uses: actions/upload-artifact@v7
        with:
          name: vibe-usage-native-x64
          path: out/app/
          retention-days: 14

  ui:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vibe-usage-native-x64
          path: C:\vu\app
      - name: Screenshots at 100 %
        shell: pwsh
        run: ./native/ci/screenshot.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag 100
      - name: Tray smoke at 100 %
        if: always()
        shell: pwsh
        run: ./native/ci/tray-smoke.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag 100
      - name: Scale to 150 % while running (tray icon reload)
        id: dpi
        if: always()
        shell: pwsh
        run: |
          ./native/ci/dpi-icon.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Percent 150
          if ($LASTEXITCODE -eq 3) { "scaled=false" >> $env:GITHUB_OUTPUT; exit 0 }
          "scaled=true" >> $env:GITHUB_OUTPUT
          exit $LASTEXITCODE
      - name: Screenshots at 150 %
        if: always() && steps.dpi.outputs.scaled == 'true'
        shell: pwsh
        run: ./native/ci/screenshot.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag 150
      - name: Tray smoke at 150 %
        if: always() && steps.dpi.outputs.scaled == 'true'
        shell: pwsh
        run: ./native/ci/tray-smoke.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag 150
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ui-results
          path: C:\vu\out\
          retention-days: 14

  quota:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        percent: [100, 150]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vibe-usage-native-x64
          path: C:\vu\app
      - name: Scale to ${{ matrix.percent }} %
        id: dpi
        if: matrix.percent != 100
        shell: pwsh
        run: |
          . ./native/ci/common.ps1
          Set-Resolution @('1920x1200', '1920x1080')
          ./native/ci/set-dpi.ps1 -Percent ${{ matrix.percent }}
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::the runner refused ${{ matrix.percent }} %"; "scaled=false" >> $env:GITHUB_OUTPUT; exit 0 }
          "scaled=true" >> $env:GITHUB_OUTPUT
      - name: 订阅配额 scenes at ${{ matrix.percent }} %
        if: matrix.percent == 100 || steps.dpi.outputs.scaled == 'true'
        shell: pwsh
        run: ./native/ci/quota-screens.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag ${{ matrix.percent }}
      - name: 订阅配额 driven by pointer and keyboard
        if: always() && matrix.percent == 100
        shell: pwsh
        run: ./native/ci/quota-smoke.ps1 -AppDir C:\vu\app -OutDir C:\vu\out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-quota-${{ matrix.percent }}
          path: C:\vu\out\
          retention-days: 14
