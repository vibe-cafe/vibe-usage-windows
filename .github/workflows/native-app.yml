# The native Windows app (WinUI 3 shell native/src/VibeUsage.App + the Rust
# backend DLL crates/ffi): unit tests of the shell's pure parts, the backend
# DLL, a self-contained fully trimmed x64 publish with the DLL, the CLI
# launcher and the bundled Node at the install root. Then, on separate
# runners:
#   ui    — original-size screenshots (PrintWindow) and the tray smoke test at
#           100 % and 150 %, on the in-memory fake backend;
#   chain — the real backend against a local fake VibeCafé service: sign-in
#           start waiting for the proxy, "test two" with a logging proxy and
#           with no proxy, quitting with Node alive and deleting the install
#           folder at once (native/ci/chain.ps1). No real server, no real
#           account: outbound traffic of the app and its Node is blocked.
name: Native app

on:
  push:
    branches: [main, 'feat/native-**']
    paths:
      - 'native/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src-tauri/resources/cli-bootstrap.mjs'
      - 'scripts/fetch-node.mjs'
      - 'scripts/cargo-windows.ps1'
      - '.github/workflows/native-app.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src-tauri/resources/cli-bootstrap.mjs'
      - 'scripts/fetch-node.mjs'
      - 'scripts/cargo-windows.ps1'
      - '.github/workflows/native-app.yml'

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Shell unit tests (open and close rules, placement, click race, demo data)
        run: dotnet test native/tests/VibeUsage.App.Tests -c Release
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-ffi
      - name: Backend DLL (vibe_ffi.dll, release)
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: ./scripts/cargo-windows.ps1 build --locked --release -p vibe-ffi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bundled Node runtime
        run: node scripts/fetch-node.mjs
      - name: Publish (self-contained, full trimming, x64)
        shell: pwsh
        run: |
          dotnet publish native/src/VibeUsage.App/VibeUsage.App.csproj -c Release -r win-x64 -p:Platform=x64 "-p:VibeFfiDll=${{ github.workspace }}\target\release\vibe_ffi.dll" -o out/app 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $warnings = Select-String -Path publish.log -Pattern 'warning (IL\d+|RS0030|CsWinRT\d+)' | Sort-Object Line -Unique
          if ($warnings) { $warnings | ForEach-Object { Write-Host "::error::$($_.Line)" }; exit 1 }
          Write-Host 'no trim, WinRT trimming or banned-API warnings'
          foreach ($f in 'vibe-usage-app.exe', 'vibe_ffi.dll', 'cli-bootstrap.mjs', 'node\node.exe') {
            if (-not (Test-Path (Join-Path out/app $f))) { Write-Host "::error::the package is missing $f"; exit 1 }
          }
          Write-Host 'package has the backend DLL, the CLI launcher and the bundled Node at its root'
      - name: Size
        shell: pwsh
        run: |
          $files = Get-ChildItem out/app -Recurse -File
          "{0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
          $files | Sort-Object Length -Descending | Select-Object -First 12 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name }
          Compress-Archive -Path out/app/* -DestinationPath out/size-check.zip
          "zip {0:N1} MB" -f ((Get-Item out/size-check.zip).Length / 1MB)
      - uses: actions/upload-artifact@v7
        with:
          name: vibe-usage-native-x64
          path: out/app/
          retention-days: 14

  ui:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vibe-usage-native-x64
          path: C:\vu\app
      - name: Screenshots at 100 %
        shell: pwsh
        run: ./native/ci/screenshot.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag 100
      - name: Tray smoke at 100 %
        if: always()
        shell: pwsh
        run: ./native/ci/tray-smoke.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag 100
      - name: Scale to 150 % while running (tray icon reload)
        id: dpi
        if: always()
        shell: pwsh
        run: |
          ./native/ci/dpi-icon.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Percent 150
          if ($LASTEXITCODE -eq 3) { "scaled=false" >> $env:GITHUB_OUTPUT; exit 0 }
          "scaled=true" >> $env:GITHUB_OUTPUT
          exit $LASTEXITCODE
      - name: Screenshots at 150 %
        if: always() && steps.dpi.outputs.scaled == 'true'
        shell: pwsh
        run: ./native/ci/screenshot.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag 150
      - name: Tray smoke at 150 %
        if: always() && steps.dpi.outputs.scaled == 'true'
        shell: pwsh
        run: ./native/ci/tray-smoke.ps1 -AppDir C:\vu\app -OutDir C:\vu\out -Tag 150
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ui-results
          path: C:\vu\out\
          retention-days: 14

  chain:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vibe-usage-native-x64
          path: C:\vu\package
      - name: Start → read the local fake service → panel → quit (real backend, no real server)
        shell: pwsh
        run: ./native/ci/chain.ps1 -Package C:\vu\package -OutDir C:\vu\chain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-chain-results
          path: C:\vu\chain\
          retention-days: 14
