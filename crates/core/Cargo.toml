[package]
name = "vibe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Platform-agnostic core logic for Vibe Usage for Windows (config IO, rate-limit readers, statusline hook, runtime detection, tray text rendering)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
getrandom = "0.3"
http = "1"
hyper-tls = "0.6"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
percent-encoding = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
tower-service = "0.3"
url = "2.5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time"] }
