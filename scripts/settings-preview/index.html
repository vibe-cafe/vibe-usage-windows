<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Settings preview</title>
    <!-- Headless Chrome's virtual clock does not run CSS transitions: show
         every control in its end state. -->
    <style>
      *, *::before, *::after { transition: none !important; }
    </style>
  </head>
  <body style="margin: 0; background: #1e1e1e">
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
